[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codenames-interpretability"
version = "1.0.0"
description = "Layer-wise word representation geometry across transformer architectures, evaluated on Codenames Duet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "João Pedro Ferreira Pereira Königs" }]
keywords = ["interpretability", "transformers", "geometric-analysis", "codenames"]

dependencies = [
    # The torch stack must stay mutually consistent: transformers transitively
    # imports torchvision on every model load, so a torchvision built against a
    # different torch crashes with "operator torchvision::nms does not exist".
    # These are FLOORS, not exact pins (2026-08-30): exact pins tracked one
    # Colab image and broke when the image moved past the pinned wheels
    # (torchvision==0.20.1 uninstallable on the current runtime). A floor lets
    # pip keep Colab's own preinstalled, matched stack, and keeps the local env
    # (torch 2.5.1 / torchvision 0.20.1 / torchaudio 2.5.1) untouched. The
    # versions a run actually used are recorded by the runner logs; the paper's
    # reproducibility card states the versions of the runs it reports.
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=2.5.1",
    "transformers==4.48.0",
    # numpy/pandas as floors for the same reason: the old exact pins matched an
    # earlier Colab image (and numpy 2.0.2 / pandas 2.2.2 have no wheels for
    # newer Pythons); the local env satisfies the floors as installed.
    "numpy>=2.0.2,<3",
    "pandas>=2.2.2,<3",
    "tqdm>=4.67.1",
    "scipy>=1.14.1,<2",
    "pyarrow>=18.1.0",
    "accelerate>=1.2.1,<2",
]

[project.optional-dependencies]
# Local, post-hoc visualization only. NOT installed in Colab and NOT imported by
# the experiment run/doctor paths, so these are deliberately kept out of the core
# `dependencies` pin set (which is tuned to coexist with Colab's stack). Install
# locally with `pip install -e ".[viz]"`. Pinned for reproducible figures.
viz = [
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "scikit-learn==1.5.2",
    "umap-learn==0.5.7",
    "adjusttext==1.3.0",
]
# Tuned-lens translator training text (GPU stage only). Kept out of the core
# pin set; verify Colab coexistence with `doctor` before a run.
lens = [
    "datasets==3.2.0",
]
# Local client for the Colab job queue (Drive API). Client side only — the
# Colab runner reaches the same job tree through its FUSE mount and needs none
# of this, so these stay out of the Colab-tuned core pin set.
remote = [
    "google-api-python-client==2.149.0",
    "google-auth-oauthlib==1.2.1",
]

[project.scripts]
codenames-experiment = "codenames.cli:main"

[tool.setuptools.packages.find]
include = ["codenames*"]
exclude = ["notebooks*"]

[tool.pytest.ini_options]
markers = [
    "network: tests that download the tiny HF fixture model (cached after first run)",
]
